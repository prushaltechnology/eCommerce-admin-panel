name: Deploy Admin Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy (leave empty for latest main)'
        required: false
        default: ''

env:
  REMOTE_USER: ubuntu
  REMOTE_HOST: 3.110.139.229
  REMOTE_DIR: admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate commit_sha format
        if: ${{ inputs.commit_sha != '' }}
        run: |
          if ! [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::commit_sha '${{ inputs.commit_sha }}' doesn't look like a valid git SHA (7-40 hex chars)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Show deployed commit
        run: git log -1 --oneline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          cat <<EOF > .env
          VITE_GRAPHQL_URI=https://api.flowersandgarlands.com/graphql/
          VITE_WS_ORDERS_URL=wss://api.flowersandgarlands.com/ws/admin/orders/
          VITE_USER_ENCRYPTION_KEY=${{ secrets.VITE_USER_ENCRYPTION_KEY }}
          EOF

      - name: Build
        run: npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

      - name: Remove old dist on server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} \
            "rm -rf ~/${{ env.REMOTE_DIR }}/dist"

      - name: Copy new dist to server
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem -r dist \
            ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:~/${{ env.REMOTE_DIR }}/

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key.pem
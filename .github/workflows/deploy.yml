name: Deploy Admin Frontend

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    REMOTE_USER: ubuntu
    REMOTE_HOST: 3.110.139.229
    REMOTE_DIR: admin

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Create .env file
              run: |
                  cat <<EOF > .env
                  VITE_GRAPHQL_URI=https://api.flowersandgarlands.com/graphql/
                  VITE_WS_ORDERS_URL=wss://api.flowersandgarlands.com/ws/admin/orders/
                  VITE_USER_ENCRYPTION_KEY=${{ secrets.VITE_USER_ENCRYPTION_KEY }}
                  EOF

            - name: Build
              run: npm run build

            - name: Set up SSH key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
                  chmod 600 ~/.ssh/deploy_key.pem

            - name: Remove old dist on server
              run: |
                  ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem \
                    ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} \
                    "rm -rf ~/${{ env.REMOTE_DIR }}/dist"

            - name: Copy new dist to server
              run: |
                  scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem -r dist \
                    ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:~/${{ env.REMOTE_DIR }}/

            - name: Clean up SSH key
              if: always()
              run: rm -f ~/.ssh/deploy_key.pem
